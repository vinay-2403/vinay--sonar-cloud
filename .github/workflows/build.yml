name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
jobs:
  sonarcloud:
    if: startsWith(github.head_ref, 'new_') && github.event.pull_request.merged == false
    name: SonarCloud
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./comp2
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis
      - name: Install Dependencies
        run: npm install --legacy-peer-deps
      - name: SonarCloud Scan
  uses: SonarSource/sonarqube-scan-action@v5.0.0
  with:
    args: >
      -Dsonar.projectKey=vinay-2403_vinay--sonar-cloud
      -Dsonar.organization=vinay-24031
      -Dsonar.host.url=https://sonarcloud.io
      -Dsonar.sources=.
      -Dsonar.projectBaseDir=./comp2
  env:
    SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
